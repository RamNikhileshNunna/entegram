name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build (e.g. v0.0.4)'
        required: true
        default: 'v0.0.4'

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
    steps:
      - name: Validate release tag
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag'; exit 1; }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Verify source version and prevent release replacement
        id: source
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          [[ "v${version%%+*}" == "$RELEASE_TAG" ]] || { echo 'Tag and app version differ'; exit 1; }
          if response=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1); then
            echo 'Release already exists; refusing to replace its artifacts.'
            exit 1
          elif [[ "$response" != *'HTTP 404'* ]]; then
            echo 'Could not verify release availability.'
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check persistent signing availability
        id: signing_available
        env:
          SIGNING_KEYSTORE: ${{ secrets.ENTEGRAM_ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ENTEGRAM_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -n "$SIGNING_KEYSTORE" && -n "$SIGNING_PASSWORD" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Signing secrets are missing. Analysis and tests will run; APK build/publication are skipped rather than using a new key.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Install native crypto test library
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded

      - name: Restore the persistent v0.0.2 signing key
        if: steps.signing_available.outputs.enabled == 'true'
        id: signing
        env:
          ENTEGRAM_KEYSTORE_BASE64: ${{ secrets.ENTEGRAM_ANDROID_KEYSTORE_BASE64 }}
          ENTEGRAM_KEYSTORE_PASSWORD: ${{ secrets.ENTEGRAM_ANDROID_KEYSTORE_PASSWORD }}
        run: python3 tool/signing.py prepare

      - name: Build release APK
        if: steps.signing_available.outputs.enabled == 'true'
        env:
          ENTEGRAM_KEYSTORE_PASSWORD: ${{ secrets.ENTEGRAM_ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --no-pub

      - name: Verify the APK signing identity
        if: steps.signing_available.outputs.enabled == 'true'
        run: python3 tool/signing.py verify-apk build/app/outputs/flutter-apk/app-release.apk

      - name: Stage APK and checksum
        if: steps.signing_available.outputs.enabled == 'true'
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/entegram-$RELEASE_TAG.apk"
          cd dist
          sha256sum "entegram-$RELEASE_TAG.apk" > SHA256SUMS.txt

      - name: Publish GitHub Release
        if: steps.signing_available.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ steps.source.outputs.sha }}
          name: Entegram ${{ steps.meta.outputs.tag }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          overwrite_files: false
          fail_on_unmatched_files: true
          body: |
            Ente Photos memories, stories and a responsive feed, with local Ente ML scene themes and collage previews.

            **Moods & settings:** Happy hour, Work mode, Cozy cafés, celebrations, golden hour and other visual themes reuse compatible Ente CLIP results. Enable machine learning in Ente Photos and let its encrypted index sync first. These are approximate visual themes, not emotion or occupation assessments.

            **Install over v0.0.2:** this APK reuses the original v0.0.2 signing key, so Android can update that installation while preserving local app data. No uninstall is needed for the original v0.0.2 build.

            The APK and SHA256SUMS.txt were built together from tagged source commit `${{ steps.source.outputs.sha }}` after analysis and automated tests passed. Physical-device playback and performance have not been validated by this workflow.

      - name: Remove the temporary signing key
        if: always()
        run: rm -rf "${RUNNER_TEMP:?}/entegram-signing"
